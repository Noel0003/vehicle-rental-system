{% extends 'base.html' %}{% block title %}My profile | DriveEase{% endblock %}{% block content %}<section class="page-wrap narrow-wrap"><div class="panel form-panel"><div class="form-heading"><div class="eyebrow">ACCOUNT SETTINGS</div><h1>Your profile</h1><p>Update your personal contact details.</p></div><form method="post" class="form-stack"><label>Full name<input name="full_name" value="{{ user.full_name }}" required></label><label>Email address<input value="{{ user.email }}" disabled></label><label>Phone number<input name="phone" value="{{ user.phone }}" placeholder="Your contact number"></label><label>Account type<input value="{{ user.role|capitalize }}" disabled></label><button class="btn btn-primary">Save profile →</button></form></div></section>{% endblock %}
